<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Crea tu equipo Pokémon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container text-center py-4">
        <h1 class="mb-3 fw-bold">GENERA TU EQUIPO ALEATORIO!</h1>
        <button id="cargar" class="btn btn-danger btn-lg mb-4 shadow-sm">Generar</button>
        <div id="galeria" class="row g-3 justify-content-center"></div>
    </div>

</body>

</html>
<script>
    const Cargar = document.getElementById('cargar');
    const galeria = document.getElementById('galeria');

    function generarIdsAleatorios(cantidad, max) {
        const ids = [];
        while (ids.length < cantidad) {
            const idRamdom = Math.floor(Math.random() * max) + 1;
            if (!ids.includes(idRamdom)) {
                ids.push(idRamdom);
            }
        }
        return ids;
    }

    Cargar.addEventListener('click', () => {
        const ids = generarIdsAleatorios(6, 155);

        const peticiones = ids.map(id =>
            fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(res => res.json())
        );

        galeria.innerHTML = '';

        Promise.all(peticiones)
            .then(pokemones => {
                pokemones.forEach(pokemon => {
                    const nombre = pokemon.name;
                    const imagen = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
                    const tipos = pokemon.types.map(t => t.type.name).join(', ');

                    const columna = document.createElement('div');
                    columna.className = 'col-6 col-md-4 col-lg-2';

                    columna.innerHTML = `
          <div class="card h-100 shadow-sm text-center p-2">
            <img src="${imagen}" class="card-img-top" alt="${nombre}">
            <div class="card-body p-2 d-flex flex-column justify-content-center">
              <h5 class="card-title text-capitalize fs-6 fw-bold mb-1">${nombre}</h5>
              <p class="card-text small text-muted mb-0"><strong>Tipo:</strong> ${tipos}</p>
            </div>
          </div>
        `;

                    galeria.appendChild(columna);
                });
            })
            .catch(error => console.error('Error al obtener los Pokémon:', error));
    });
</script>
